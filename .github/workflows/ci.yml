name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --check src/index.js && node --check src/lib.js
      - run: bash -n install.sh && bash -n uninstall.sh && bash -n bin/api-manager

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          export HOME="$RUNNER_TEMP/fakehome" BIN="$RUNNER_TEMP/fakehome/.local/bin/api-manager"
          mkdir -p "$HOME"
          bash ./install.sh
          "$BIN" list
          echo '{"smoke":{"token":"t","url":"https://example.com"}}' | "$BIN" import
          "$BIN" list
          "$BIN" use smoke
          test "$("$BIN" current)" = "smoke"
          "$BIN" export | node -e "JSON.parse(require('fs').readFileSync(0,'utf-8'))"
          echo "SMOKE OK"
